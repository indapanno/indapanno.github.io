name: Build terms

on:
  push:
    branches: [main]
    paths:
      - 'json/**'
      - '_src/templates/**'
      - 'js/render-term.js'
      - 'js/thai-numerals.js'
      - '.github/scripts/build-terms.js'
      - '.github/scripts/site-config.js'
  # Ручной запуск (Actions → Build terms → Run workflow): нужен после правок шаблонов
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build terms
        run: node .github/scripts/build-terms.js

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- terms/ nav/ how/index.html index.html sitemap.xml 'json/index_*.json'
          if git diff --staged --quiet; then
            echo "Нет изменений для коммита"
          else
            git commit -m "Автосборка терминов [skip ci]"
            ok=0
            for i in 1 2 3 4 5 6; do
              if git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD; then ok=1; break; fi
              echo "Отправка не удалась (попытка $i), повтор"; sleep $((RANDOM % 5 + 2))
            done
            [ "$ok" = 1 ] || exit 1
          fi
