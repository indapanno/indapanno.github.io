name: Build publications

# Сборка страниц «Публикации». Независима от сборки терминов и связок:
# только читает термины и пишет в publications/*.html и sitemap_publications.xml.
on:
  push:
    # migration — временно, на время переезда; после влития в main строка возвращается к [main]
    branches: [main, migration]
    paths:
      - '_src/publications/**'
      - 'publications/covers/**'
      - 'css/publications.css'
      - '.github/scripts/build-publications.js'
      - '.github/scripts/test-publications.js'
      - '.github/scripts/site-config.js'
  # После каждой сборки терминов: перепроверка ссылок на термины в статьях
  workflow_run:
    workflows: ['Build terms']
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Сборки идут по очереди, без отмены уже идущих
concurrency:
  group: build-publications
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # push и ручной запуск — ветка запуска; workflow_run — ветка, на которой прошла сборка терминов (main)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: node .github/scripts/test-publications.js

      # При ошибках в публикациях шаг не останавливает job: валидные публикации всё равно
      # собираются, а красный статус ставится последним шагом.
      - name: Build publications
        id: build
        continue-on-error: true
        run: node .github/scripts/build-publications.js

      # Папку publications/covers/ бот не коммитит (её кладёт заказчик)
      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- 'publications/*.html' sitemap_publications.xml
          if git diff --staged --quiet; then
            echo "Нет изменений для коммита"
          else
            git commit -m "Автосборка публикаций [skip ci]"
            git pull --rebase origin ${{ github.event.workflow_run.head_branch || github.ref_name }}
            git push origin HEAD
          fi

      - name: Fail if publications have errors
        if: steps.build.outcome == 'failure'
        run: |
          echo "В публикациях найдены ошибки (см. шаг Build publications). Публикации с ошибками не созданы."
          exit 1
